# PipeWire na Pi jukeboxu — delší takt místo nízké latence.
# Instaluje packaging/rpi/deploy.sh do ~/.config/pipewire/pipewire.conf.d/.
#
# Na Pi 3 vedle zvuku běží yt-dlp s node a na desítky vteřin vytíží jádro.
# S výchozím taktem (1024 vzorků = 21 ms) pak graf občas nestihne dodat data
# a v repráku lupne. Jukebox latenci nepotřebuje, 43 ms nikdo neuslyší.
context.properties = {
  default.clock.quantum     = 2048
  default.clock.min-quantum = 1024
  default.clock.max-quantum = 4096
}
