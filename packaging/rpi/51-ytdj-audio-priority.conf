# WirePlumber 0.5 — output priorities for the Raspberry Pi jukebox.
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by packaging/rpi/deploy.sh.
#
#   USB sound card (when plugged in)  >  onboard 3.5 mm jack  >  HDMI (never wins)
#
# Match values starting with "~" are regular expressions.
# The default sink follows priority.session only while no default has been
# pinned by hand. `wpctl set-default` stores a pin in
# ~/.local/state/wireplumber/default-nodes that overrides this; deploy.sh
# clears that pin.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output\\.usb-.*" } ]
    actions = { update-props = {
      priority.session = 2000, priority.driver = 2000
      # rezerva v bufferu karty proti lupání při vytíženém CPU
      api.alsa.headroom = 1024
      # neuspávat: probouzení USB karty na začátku skladby / po pauze cvaká
      session.suspend-timeout-seconds = 0
    } }
  }
  {
    # onboard 3.5 mm jack (bcm2835 headphones)
    matches = [
      { alsa.card_name = "~bcm2835.*Headphones.*" }
    ]
    actions = { update-props = { priority.session = 1000, priority.driver = 1000 } }
  }
  {
    matches = [
      { node.name = "~alsa_output\\..*hdmi.*" }
      { alsa.card_name = "~vc4-hdmi.*" }
    ]
    actions = { update-props = { priority.session = 50, priority.driver = 50 } }
  }
]

# Hlasitost řídí jen ytdj (mpv) — displej, tlačítka na repráku i web ukazují
# jedno číslo. Výstup proto drží plnou hlasitost, i u nově zapojené karty.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
