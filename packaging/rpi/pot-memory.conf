# PO token server (bgutil, node): menší mladá generace haldy V8.
# Instaluje packaging/rpi/deploy.sh jako drop-in pro ytdj-pot.service.
#
# Pi 26. 10. 2026: server měl špičku 187 MB (VmHWM), z toho 151 MB ve swapu.
# Na PC (node 22, 8 tokenů): výchozí 171 MB, s --max-semi-space-size=2 142 MB,
# všech 8 tokenů v pořádku. Strop staré generace (--max-old-space-size) se
# nenastavuje: ušetřil by dalších ~8 MB, ale při růstu by server spadl.
[Service]
Environment=NODE_OPTIONS=--max-semi-space-size=2
