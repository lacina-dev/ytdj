<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1013">
<title>ytdj — AI DJ</title>
<style>
  :root {
    --bg: #0e1013;
    --bg-glow: rgba(216, 166, 87, 0.10);
    --surface: rgba(255, 255, 255, 0.035);
    --surface-2: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    --text: #ece9e4;
    --text-dim: #a3a099;
    --text-faint: #6f6d68;
    --accent: #d8a657;
    --accent-soft: rgba(216, 166, 87, 0.16);
    --accent-text: #e8b76a;
    --ok: #7fb069;
    --warn: #d98c5f;
    --err: #d96f6f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.35);
    --radius: 14px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf7f2;
      --bg-glow: rgba(176, 124, 32, 0.10);
      --surface: rgba(30, 24, 12, 0.035);
      --surface-2: rgba(30, 24, 12, 0.065);
      --line: rgba(30, 24, 12, 0.12);
      --line-soft: rgba(30, 24, 12, 0.07);
      --text: #1d1b17;
      --text-dim: #5f5b53;
      --text-faint: #8b867d;
      --accent: #9a6f1c;
      --accent-soft: rgba(154, 111, 28, 0.14);
      --accent-text: #8a6216;
      --ok: #4d7c3a;
      --warn: #a85d28;
      --err: #b04141;
      --shadow: 0 1px 2px rgba(60,45,20,.08), 0 8px 28px rgba(60,45,20,.08);
    }
  }

  * { box-sizing: border-box; }

  /* atribut hidden musí platit i na <svg> — v Chrome ho UA styl sám neskryje */
  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(1100px 620px at 18% -12%, var(--bg-glow), transparent 62%),
      radial-gradient(900px 520px at 96% 4%, var(--bg-glow), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 22px 20px 64px;
  }

  /* ---------- hlavička ---------- */

  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 620;
    letter-spacing: .015em;
  }
  .brand .name { font-size: 1.02rem; }
  .brand .sub {
    font-size: .74rem;
    color: var(--text-faint);
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  @media (max-width: 420px) { .brand .sub { display: none; } }

  .conn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
    font-size: .76rem;
    color: var(--text-faint);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex: none;
    transition: background .3s;
  }
  .conn.online .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .conn.offline .dot { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 22%, transparent); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px; height: 42px;
    flex: none;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
    color: var(--text-dim);
    transition: background .18s, color .18s, border-color .18s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 19px; height: 19px; }

  /* ---------- rozvržení ---------- */

  .cols {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    gap: 34px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .cols { grid-template-columns: minmax(0, 1fr); gap: 30px; }
  }

  .stack { display: flex; flex-direction: column; gap: 30px; min-width: 0; }

  /* ---------- co hraje ---------- */

  .now { min-width: 0; }

  .eyebrow {
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  .bars i {
    display: block;
    width: 2px;
    background: var(--accent);
    border-radius: 1px;
    height: 30%;
    animation: eq 1.15s ease-in-out infinite;
  }
  .bars i:nth-child(2) { animation-delay: .22s; }
  .bars i:nth-child(3) { animation-delay: .45s; }
  .bars i:nth-child(4) { animation-delay: .1s; }
  @keyframes eq { 0%,100% { height: 22%; } 50% { height: 100%; } }
  .bars.still i { animation-play-state: paused; height: 26%; opacity: .5; }
  @media (prefers-reduced-motion: reduce) { .bars i { animation: none; height: 55%; } }

  .track-title {
    margin: 0;
    font-size: clamp(1.6rem, 4.6vw, 2.6rem);
    line-height: 1.14;
    font-weight: 600;
    letter-spacing: -.018em;
    overflow-wrap: anywhere;
  }
  .track-artist {
    margin: 8px 0 0;
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    color: var(--accent-text);
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .track-album {
    margin: 5px 0 0;
    font-size: .84rem;
    color: var(--text-faint);
    overflow-wrap: anywhere;
  }
  .idle .track-title { color: var(--text-dim); font-weight: 500; }

  /* ---------- pozice ---------- */

  .progress { margin-top: 22px; }
  .track-bar {
    position: relative;
    height: 4px;
    border-radius: 99px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .track-bar > span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: var(--accent);
    border-radius: 99px;
  }
  .times {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-size: .78rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  /* ---------- ovládání ---------- */

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .ctl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    transition: background .18s, transform .12s, border-color .18s, opacity .18s;
  }
  .ctl:hover { background: var(--surface-2); }
  .ctl:active { transform: scale(.94); }
  .ctl svg { width: 20px; height: 20px; }
  .ctl.primary {
    width: 62px; height: 62px;
    background: var(--accent);
    border-color: transparent;
    color: #14110b;
  }
  .ctl.primary svg { width: 24px; height: 24px; }
  .ctl.primary:hover { background: color-mix(in srgb, var(--accent) 88%, white); }
  .ctl[disabled] { opacity: .38; cursor: not-allowed; }
  .ctl[disabled]:active { transform: none; }

  .vol {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-left: auto;
    min-width: 170px;
    flex: 1 1 170px;
    max-width: 260px;
    color: var(--text-faint);
  }
  @media (max-width: 560px) {
    .vol { margin-left: 0; max-width: none; flex-basis: 100%; padding-top: 6px; }
  }
  .vol svg { width: 18px; height: 18px; flex: none; }
  .vol output {
    font-size: .76rem;
    font-variant-numeric: tabular-nums;
    min-width: 2.4em;
    text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;
    height: 26px;
    background: transparent;
    margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 99px; background: var(--surface-2);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 99px; background: var(--surface-2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px; margin-top: -5.5px;
    border-radius: 50%; background: var(--text-dim); border: none;
    transition: background .15s;
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px;
    border-radius: 50%; background: var(--text-dim); border: none;
  }
  input[type=range]:hover::-webkit-slider-thumb { background: var(--accent); }
  input[type=range]:hover::-moz-range-thumb { background: var(--accent); }

  /* ---------- zadání pro DJe ---------- */

  .composer {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    transition: border-color .2s, background .2s;
  }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .composer.busy { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

  .composer .row { display: flex; align-items: flex-end; gap: 10px; padding: 12px 12px 12px 16px; }

  #prompt {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    resize: none;
    padding: 8px 0;
    max-height: 160px;
    line-height: 1.45;
    font-size: 1.02rem;
  }
  #prompt:focus { outline: none; }
  #prompt::placeholder { color: var(--text-faint); }
  #prompt:disabled { color: var(--text-faint); }

  .send {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border-radius: 11px;
    border: none;
    background: var(--accent);
    color: #14110b;
    transition: opacity .18s, background .18s;
  }
  .send svg { width: 19px; height: 19px; }
  .send[disabled] { opacity: .35; cursor: not-allowed; }

  .composer .note {
    display: none;
    align-items: center;
    gap: 9px;
    padding: 0 16px 13px;
    font-size: .82rem;
    color: var(--text-dim);
  }
  .composer.busy .note { display: flex; }

  .spinner {
    width: 14px; height: 14px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--accent-soft);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .reply {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    font-size: .95rem;
    line-height: 1.55;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .reply.show { display: block; }
  .reply.error {
    background: color-mix(in srgb, var(--err) 12%, transparent);
    border-color: color-mix(in srgb, var(--err) 30%, transparent);
    color: var(--text);
  }

  .hint {
    margin-top: 10px;
    font-size: .76rem;
    color: var(--text-faint);
  }

  /* ---------- kontext: nálada + seedy ---------- */

  .context { display: flex; flex-direction: column; gap: 12px; }
  .mood {
    font-size: .88rem;
    color: var(--text-dim);
  }
  .mood b { color: var(--text); font-weight: 500; }
  .mood .lbl {
    font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-faint); margin-right: 8px;
  }

  .pools { display: flex; flex-wrap: wrap; gap: 7px; }
  .pool {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 99px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    font-size: .78rem;
    color: var(--text-dim);
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .pool .n {
    font-size: .7rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- panely (fronta, historie) ---------- */

  section.panel { min-width: 0; }

  .panel h2 {
    margin: 0 0 12px;
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2 .count {
    letter-spacing: 0;
    text-transform: none;
    font-weight: 500;
    color: var(--text-faint);
    opacity: .8;
  }

  ol.list, ul.list { list-style: none; margin: 0; padding: 0; }

  .list li {
    display: flex;
    align-items: baseline;
    gap: 11px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line-soft);
    min-width: 0;
  }
  .list li:last-child { border-bottom: 0; }

  .list .idx {
    flex: none;
    width: 1.3em;
    font-size: .74rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .list .meta { min-width: 0; flex: 1; }
  .list .t {
    display: block;
    font-size: .92rem;
    overflow-wrap: anywhere;
  }
  .list .a {
    display: block;
    font-size: .78rem;
    color: var(--text-faint);
    overflow-wrap: anywhere;
  }
  .list .dur {
    flex: none;
    font-size: .76rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .hist .mark { flex: none; width: 14px; height: 14px; align-self: center; }
  .hist .mark svg { width: 14px; height: 14px; display: block; }
  .hist .finished { color: var(--ok); }
  .hist .skipped { color: var(--text-faint); }
  .hist li.skipped-row .t {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--line);
  }

  .empty {
    font-size: .85rem;
    color: var(--text-faint);
    padding: 6px 0 2px;
  }

  /* ---------- banner ---------- */

  .banner {
    display: none;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding: 11px 15px;
    border-radius: 11px;
    background: color-mix(in srgb, var(--err) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--err) 30%, transparent);
    font-size: .86rem;
    color: var(--text);
  }
  .banner.show { display: flex; }
  .banner svg { width: 17px; height: 17px; flex: none; color: var(--err); }

  /* ---------- nastavení ---------- */

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s;
    z-index: 40;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  aside.settings {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(440px, 100%);
    background: var(--bg);
    border-left: 1px solid var(--line);
    box-shadow: var(--shadow);
    transform: translateX(101%);
    transition: transform .26s cubic-bezier(.4,0,.2,1);
    z-index: 50;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  aside.settings.show { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    aside.settings, .backdrop { transition: none; }
  }

  .settings .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .settings .head h2 { margin: 0; font-size: 1rem; font-weight: 600; }

  .settings .body {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    -webkit-overflow-scrolling: touch;
  }

  .field { margin-bottom: 20px; }
  .field > label.top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: .9rem;
    font-weight: 500;
    margin-bottom: 5px;
  }
  .field .help {
    font-size: .78rem;
    color: var(--text-faint);
    margin: 0 0 8px;
    line-height: 1.45;
  }
  .field input[type=text],
  .field input[type=number],
  .field select {
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    min-height: 42px;
  }
  .field select { appearance: none; padding-right: 30px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-faint) 50%),
                      linear-gradient(135deg, var(--text-faint) 50%, transparent 50%);
    background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }

  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

  .tag {
    font-size: .64rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--warn) 16%, transparent);
    color: var(--warn);
    border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    font-weight: 600;
    white-space: nowrap;
  }

  .settings .foot {
    flex: none;
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: .92rem;
  }
  .btn.primary { background: var(--accent); color: #14110b; border-color: transparent; font-weight: 550; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .settings .msg { font-size: .8rem; color: var(--text-dim); flex: 1 1 100%; margin: 0; }
  .settings .msg.warn { color: var(--warn); }
  .settings .msg.err { color: var(--err); }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="name">ytdj</span>
      <span class="sub">AI DJ</span>
    </div>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">připojuji…</span></span>
    <button class="icon-btn" id="openSettings" aria-label="Nastavení" title="Nastavení">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/>
        <circle cx="16" cy="6" r="2.1"/><circle cx="10" cy="12" r="2.1"/><circle cx="16" cy="18" r="2.1"/>
      </svg>
    </button>
  </header>

  <div class="banner" id="banner" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M12 8v5"/><path d="M12 16.5v.01"/><circle cx="12" cy="12" r="9"/>
    </svg>
    <span id="bannerText"></span>
  </div>

  <div class="cols">

    <!-- ======== levý sloupec ======== -->
    <div class="stack">

      <section class="now idle" id="now" aria-label="Právě hraje">
        <p class="eyebrow">
          <span class="bars still" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="nowLabel">nic nehraje</span>
        </p>
        <h1 class="track-title" id="title">Ticho</h1>
        <p class="track-artist" id="artist" hidden></p>
        <p class="track-album" id="album" hidden></p>

        <div class="progress" id="progress" hidden>
          <div class="track-bar" role="progressbar" id="bar" aria-label="Pozice ve skladbě"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="barFill"></span></div>
          <div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
        </div>

        <div class="controls">
          <button class="ctl primary" id="btnPlay" aria-label="Přehrát">
            <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3c-.7-.4-1.6.1-1.6.9z"/></svg>
            <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="6.5" y="5" width="4" height="14" rx="1.3"/><rect x="13.5" y="5" width="4" height="14" rx="1.3"/></svg>
          </button>
          <button class="ctl" id="btnNext" aria-label="Další skladba" title="Další">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5.4v13.2c0 .8.9 1.2 1.5.8l9.3-6.6c.5-.4.5-1.2 0-1.6L7.5 4.6C6.9 4.2 6 4.6 6 5.4z"/><rect x="17.6" y="4.6" width="2.6" height="14.8" rx="1.3"/></svg>
          </button>
          <button class="ctl" id="btnStop" aria-label="Zastavit a vyprázdnit frontu" title="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.2"/></svg>
          </button>

          <div class="vol">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor" stroke="none"/>
              <path d="M15.6 9.4a3.6 3.6 0 0 1 0 5.2"/><path d="M18.2 7a7 7 0 0 1 0 10"/>
            </svg>
            <input type="range" id="vol" min="0" max="100" step="1" value="100" aria-label="Hlasitost">
            <output id="volOut" for="vol">100</output>
          </div>
        </div>
      </section>

      <section aria-label="Zadání pro DJe">
        <div class="composer" id="composer">
          <div class="row">
            <textarea id="prompt" rows="1" enterkeyhint="send" autocomplete="off"
                      placeholder="Řekni, co chceš slyšet… („hraj něco veselýho“)"></textarea>
            <button class="send" id="btnSend" aria-label="Odeslat DJovi">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/>
              </svg>
            </button>
          </div>
          <p class="note"><span class="spinner"></span><span id="busyText">DJ přemýšlí…</span></p>
        </div>
        <div class="reply" id="reply" role="status" aria-live="polite"></div>
        <p class="hint">Enter odešle, Shift+Enter udělá nový řádek. Odpověď trvá 15–25 s.</p>
      </section>

      <section class="context" id="context" aria-label="Kontext DJe" hidden>
        <div class="mood" id="moodWrap" hidden><span class="lbl">nálada</span><b id="mood"></b></div>
        <div id="poolsWrap" hidden>
          <div class="pools" id="pools"></div>
        </div>
      </section>

    </div>

    <!-- ======== pravý sloupec ======== -->
    <div class="stack">

      <section class="panel" aria-label="Fronta">
        <h2>Fronta <span class="count" id="queueCount"></span></h2>
        <ol class="list" id="queue"></ol>
        <p class="empty" id="queueEmpty">Fronta je prázdná.</p>
      </section>

      <section class="panel" aria-label="Historie">
        <h2>Odehráno</h2>
        <ul class="list hist" id="history"></ul>
        <p class="empty" id="historyEmpty">Zatím nic neodehrálo.</p>
      </section>

    </div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<aside class="settings" id="settings" aria-label="Nastavení" aria-hidden="true">
  <div class="head">
    <h2>Nastavení</h2>
    <button class="icon-btn" id="closeSettings" style="margin-left:auto" aria-label="Zavřít nastavení">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div class="body" id="settingsBody">
    <p class="empty">Načítám…</p>
  </div>
  <div class="foot">
    <button class="btn primary" id="btnSave">Uložit</button>
    <button class="btn" id="btnReload">Načíst znovu</button>
    <p class="msg" id="settingsMsg"></p>
  </div>
</aside>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* pomocné                                                             */
  /* ------------------------------------------------------------------ */

  var $ = function (sel) { return document.querySelector(sel); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fmtTime(sec) {
    if (sec == null || isNaN(sec) || sec < 0) return "–:––";
    sec = Math.floor(sec);
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    var mm = (h > 0 && m < 10) ? "0" + m : String(m);
    return (h > 0 ? h + ":" : "") + mm + ":" + (s < 10 ? "0" + s : s);
  }

  function nowMs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  // Pozor: `hidden` je vlastnost HTMLElement — na <svg> se přiřazením nic nestane.
  // Přes atribut to funguje na obojím.
  function setHidden(node, on) {
    if (on) node.setAttribute("hidden", "");
    else node.removeAttribute("hidden");
  }

  async function postJSON(path, body) {
    var res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = null;
    try { data = await res.json(); } catch (e) { /* prázdná/nevalidní odpověď */ }
    if (!res.ok) {
      var msg = (data && (data.error || data.detail || data.message)) || ("HTTP " + res.status);
      var err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      err.status = res.status;
      throw err;
    }
    return data || {};
  }

  /* ------------------------------------------------------------------ */
  /* stav klienta                                                        */
  /* ------------------------------------------------------------------ */

  var S = {
    status: null,
    trackId: undefined,
    posBase: 0,          // pozice v sekundách k okamžiku posBaseAt
    posBaseAt: nowMs(),
    duration: 0,
    running: false,      // hraje a není pauza -> pozice běží
    sending: false,      // čekáme na /api/prompt z tohoto prohlížeče
    sendStartedAt: 0,
    volDragging: false,
    volHoldUntil: 0,     // po odeslání hlasitosti chvíli nepřepisovat posuvník
    lastUpdate: 0,
    connected: false,
    sig: {}              // podpisy, ať se seznamy nepřekreslují zbytečně
  };

  var el = {
    conn: $("#conn"), connText: $("#connText"),
    banner: $("#banner"), bannerText: $("#bannerText"),
    now: $("#now"), nowLabel: $("#nowLabel"), bars: $("#bars"),
    title: $("#title"), artist: $("#artist"), album: $("#album"),
    progress: $("#progress"), bar: $("#bar"), barFill: $("#barFill"),
    elapsed: $("#elapsed"), total: $("#total"),
    btnPlay: $("#btnPlay"), icoPlay: $("#icoPlay"), icoPause: $("#icoPause"),
    btnNext: $("#btnNext"), btnStop: $("#btnStop"),
    vol: $("#vol"), volOut: $("#volOut"),
    composer: $("#composer"), prompt: $("#prompt"), btnSend: $("#btnSend"), busyText: $("#busyText"),
    reply: $("#reply"),
    context: $("#context"), moodWrap: $("#moodWrap"), mood: $("#mood"),
    poolsWrap: $("#poolsWrap"), pools: $("#pools"),
    queue: $("#queue"), queueEmpty: $("#queueEmpty"), queueCount: $("#queueCount"),
    history: $("#history"), historyEmpty: $("#historyEmpty"),
    settings: $("#settings"), backdrop: $("#backdrop"),
    settingsBody: $("#settingsBody"), settingsMsg: $("#settingsMsg"),
    btnSave: $("#btnSave"), btnReload: $("#btnReload"),
    openSettings: $("#openSettings"), closeSettings: $("#closeSettings")
  };

  /* ------------------------------------------------------------------ */
  /* spojení: SSE, při potížích návrat k dotazování                      */
  /* ------------------------------------------------------------------ */

  var es = null, pollTimer = null, sseRetryTimer = null, sseFails = 0, polling = false;

  function setConnected(ok, label) {
    S.connected = ok;
    el.conn.className = "conn " + (ok ? "online" : "offline");
    el.connText.textContent = label || (ok ? (polling ? "spojeno (dotazování)" : "spojeno") : "odpojeno");
    if (ok) hideBanner();
  }

  function showBanner(text) {
    el.bannerText.textContent = text;
    el.banner.classList.add("show");
  }
  function hideBanner() { el.banner.classList.remove("show"); }

  function onStatus(data) {
    S.lastUpdate = nowMs();
    if (!S.connected) setConnected(true);
    applyStatus(data);
  }

  function startSSE() {
    if (es) return;
    if (!("EventSource" in window)) { startPolling(); return; }
    try {
      es = new EventSource("/api/events");
    } catch (e) {
      es = null; startPolling(); return;
    }
    es.onopen = function () {
      sseFails = 0;
      stopPolling();
      setConnected(true);
    };
    var handle = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (data && typeof data === "object") onStatus(data);
    };
    es.onmessage = handle;
    es.addEventListener("status", handle);
    es.onerror = function () {
      sseFails++;
      setConnected(false);
      // EventSource se zkouší připojit sám; po několika marných pokusech
      // přejdeme na dotazování a SSE zkusíme znovu až za chvíli.
      if (sseFails >= 3) {
        closeSSE();
        startPolling();
        clearTimeout(sseRetryTimer);
        sseRetryTimer = setTimeout(function () { sseFails = 0; startSSE(); }, 20000);
      }
    };
  }

  function closeSSE() {
    if (es) { try { es.close(); } catch (e) {} }
    es = null;
  }

  function startPolling() {
    if (pollTimer) return;
    polling = true;
    pollTimer = setInterval(refresh, 1500);
    refresh();
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    polling = false;
  }

  async function refresh() {
    try {
      var res = await fetch("/api/status", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      onStatus(data);
    } catch (e) {
      setConnected(false);
      showBanner("Backend neodpovídá. Běží ytdj na 127.0.0.1:8765?");
    }
  }

  // hlídač: když ~6 s nepřišel žádný stav, je něco špatně
  setInterval(function () {
    if (S.lastUpdate && nowMs() - S.lastUpdate > 6000) {
      setConnected(false);
      showBanner("Spojení se serverem se přerušilo, zkouším se připojit znovu…");
      if (!pollTimer) startPolling();
    }
  }, 2000);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) refresh();
  });

  /* ------------------------------------------------------------------ */
  /* vykreslení stavu                                                    */
  /* ------------------------------------------------------------------ */

  function predictPos() {
    var p = S.posBase;
    if (S.running) p += (nowMs() - S.posBaseAt) / 1000;
    if (S.duration > 0) p = Math.min(p, S.duration);
    return Math.max(0, p);
  }

  function setBase(p) { S.posBase = Math.max(0, p); S.posBaseAt = nowMs(); }

  function applyStatus(s) {
    S.status = s;

    var cur = s.current || null;
    var playing = !!s.playing;
    var paused = !!s.paused;
    var dur = Number((cur && cur.duration != null) ? cur.duration : s.duration) || 0;
    var serverPos = Number(s.position) || 0;
    var id = cur ? (cur.id || (cur.title + "|" + cur.artist)) : null;

    S.duration = dur;
    S.running = playing && !paused;

    if (id !== S.trackId) {
      S.trackId = id;
      setBase(serverPos);
    } else {
      // plynulé dorovnání: velký rozdíl skokem, malý jemným posunem,
      // ať čas mezi aktualizacemi neposkakuje sem a tam
      var predicted = predictPos();
      var diff = serverPos - predicted;
      if (Math.abs(diff) > 1.5) setBase(serverPos);
      else setBase(Math.max(predicted - 0.15, predicted + diff * 0.25));
    }

    // --- co hraje ---
    if (cur) {
      el.now.classList.remove("idle");
      el.title.textContent = cur.title || "Neznámá skladba";
      setHidden(el.artist, !cur.artist);
      el.artist.textContent = cur.artist || "";
      setHidden(el.album, !cur.album);
      el.album.textContent = cur.album || "";
      el.nowLabel.textContent = paused ? "pozastaveno" : (playing ? "hraje" : "připraveno");
      el.bars.classList.toggle("still", !S.running);
    } else {
      el.now.classList.add("idle");
      el.title.textContent = "Ticho";
      setHidden(el.artist, true);
      setHidden(el.album, true);
      el.nowLabel.textContent = "nic nehraje";
      el.bars.classList.add("still");
    }

    setHidden(el.progress, !(cur && dur > 0));
    el.total.textContent = dur > 0 ? fmtTime(dur) : "–:––";

    // --- ovládání ---
    var showPause = S.running;
    setHidden(el.icoPlay, showPause);
    setHidden(el.icoPause, !showPause);
    el.btnPlay.setAttribute("aria-label", showPause ? "Pozastavit" : "Přehrát");
    el.btnPlay.title = showPause ? "Pauza" : "Přehrát";
    el.btnNext.disabled = !cur && !(s.queue && s.queue.length);
    el.btnStop.disabled = !playing && !cur;

    // --- hlasitost ---
    if (!S.volDragging && nowMs() > S.volHoldUntil && s.volume != null) {
      var v = Math.max(0, Math.min(100, Math.round(Number(s.volume))));
      if (!isNaN(v)) {
        if (String(v) !== el.vol.value) el.vol.value = String(v);
        el.volOut.textContent = String(v);
      }
    }

    // --- zaneprázdněný DJ ---
    setBusy(!!s.busy || S.sending);

    // --- nálada a seedy ---
    renderContext(s);

    // --- fronta a historie ---
    renderQueue(s.queue || []);
    renderHistory(s.history || []);
  }

  function renderContext(s) {
    var mood = (s.mood || "").trim();
    var pools = (s.pools || "").trim();

    if (S.sig.mood !== mood) {
      S.sig.mood = mood;
      setHidden(el.moodWrap, !mood);
      el.mood.textContent = mood;
    }
    if (S.sig.pools !== pools) {
      S.sig.pools = pools;
      var items = parsePools(pools);
      setHidden(el.poolsWrap, items.length === 0);
      el.pools.innerHTML = items.map(function (it) {
        return '<span class="pool">' + esc(it.label) +
               (it.count ? '<span class="n">' + esc(it.count) + "</span>" : "") + "</span>";
      }).join("");
    }
    setHidden(el.context, el.moodWrap.hasAttribute("hidden") && el.poolsWrap.hasAttribute("hidden"));
  }

  // "A — B (49), C — D (12)" -> [{label:"A — B", count:"49"}, …]
  // Dělí se až za závorkou s počtem, aby čárka ve jméně ("Earth, Wind & Fire") nevadila.
  function parsePools(str) {
    if (!str) return [];
    var raw = str.split(/\)\s*,\s+/);
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var part = raw[i].trim();
      if (i < raw.length - 1) part += ")";
      if (!part) continue;
      var m = part.match(/^(.*?)\s*\((\d+)\)$/);
      if (m) out.push({ label: m[1], count: m[2] });
      else out.push({ label: part, count: "" });
    }
    return out;
  }

  function renderQueue(q) {
    var sig = JSON.stringify(q) + "|" + S.connected;
    if (sig === S.sig.queue) return;
    S.sig.queue = sig;

    el.queueCount.textContent = q.length ? "· " + q.length : "";
    setHidden(el.queueEmpty, q.length > 0);
    el.queueEmpty.textContent = S.connected
      ? "Fronta je prázdná — řekni DJovi, co pustit."
      : "Fronta neznámá — server neodpovídá.";

    el.queue.innerHTML = q.map(function (t, i) {
      return '<li><span class="idx">' + (i + 1) + "</span>" +
             '<span class="meta"><span class="t">' + esc(t.title || "Neznámá skladba") + "</span>" +
             (t.artist ? '<span class="a">' + esc(t.artist) + "</span>" : "") +
             "</span>" +
             (t.duration ? '<span class="dur">' + fmtTime(t.duration) + "</span>" : "") +
             "</li>";
    }).join("");
  }

  var ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>';
  var ICO_SKIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>';

  function renderHistory(h) {
    var sig = JSON.stringify(h);
    if (sig === S.sig.history) return;
    S.sig.history = sig;

    var items = h.slice(0, 12); // server posílá nejnovější první
    setHidden(el.historyEmpty, items.length > 0);

    el.history.innerHTML = items.map(function (t) {
      var skipped = t.outcome === "skipped";
      var cls = skipped ? "skipped" : "finished";
      var label = skipped ? "přeskočeno" : (t.outcome === "finished" ? "dohráno" : String(t.outcome || ""));
      return '<li class="' + (skipped ? "skipped-row" : "") + '">' +
             '<span class="mark ' + cls + '" title="' + esc(label) + '">' +
             (skipped ? ICO_SKIP : ICO_OK) + "</span>" +
             '<span class="meta"><span class="t">' + esc(t.title || "Neznámá skladba") + "</span>" +
             (t.artist ? '<span class="a">' + esc(t.artist) + "</span>" : "") +
             "</span></li>";
    }).join("");
  }

  /* plynulý ukazatel pozice — mezi aktualizacemi si dopočítáváme lokálně */
  function tick() {
    var p = predictPos();
    var pct = S.duration > 0 ? Math.max(0, Math.min(100, (p / S.duration) * 100)) : 0;
    el.barFill.style.width = pct.toFixed(2) + "%";
    el.bar.setAttribute("aria-valuenow", String(Math.round(pct)));
    el.elapsed.textContent = fmtTime(p);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ------------------------------------------------------------------ */
  /* ovládání                                                            */
  /* ------------------------------------------------------------------ */

  async function control(action, value) {
    try {
      await postJSON("/api/control", { action: action, value: (value == null ? null : value) });
      hideBanner();
      if (!polling) setTimeout(refresh, 120);
    } catch (e) {
      showBanner("Povel se nepovedl: " + e.message);
    }
  }

  el.btnPlay.addEventListener("click", function () {
    var running = S.running;
    // optimisticky přepnout ikonu, ať tlačítko reaguje hned
    setBase(predictPos());
    S.running = !running;
    setHidden(el.icoPlay, S.running);
    setHidden(el.icoPause, !S.running);
    control(running ? "pause" : "play", null);
  });

  el.btnNext.addEventListener("click", function () { control("next", null); });
  el.btnStop.addEventListener("click", function () { control("stop", null); });

  // hlasitost: při tažení jen popisek, POST až při puštění
  el.vol.addEventListener("input", function () {
    S.volDragging = true;
    el.volOut.textContent = el.vol.value;
  });
  function commitVolume() {
    if (!S.volDragging) return;
    S.volDragging = false;
    S.volHoldUntil = nowMs() + 2000;
    control("volume", parseInt(el.vol.value, 10));
  }
  el.vol.addEventListener("change", commitVolume);
  el.vol.addEventListener("pointerup", commitVolume);
  el.vol.addEventListener("touchend", commitVolume);
  el.vol.addEventListener("blur", commitVolume);

  // klávesové zkratky mimo textová pole
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && el.settings.classList.contains("show")) { closeSettings(); return; }
    var t = ev.target;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
                       t.tagName === "SELECT" || t.isContentEditable);
    if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === " ") { ev.preventDefault(); el.btnPlay.click(); }
    else if (ev.key === "n") el.btnNext.click();
    else if (ev.key === "/") { ev.preventDefault(); el.prompt.focus(); }
  });

  /* ------------------------------------------------------------------ */
  /* zadání pro DJe                                                      */
  /* ------------------------------------------------------------------ */

  var busyTimer = null;

  function setBusy(busy) {
    el.composer.classList.toggle("busy", busy);
    el.prompt.disabled = S.sending;   // cizí požadavek pole neblokuje, jen odeslání
    el.btnSend.disabled = busy || !el.prompt.value.trim();
    if (busy && !busyTimer) {
      busyTimer = setInterval(updateBusyText, 500);
    } else if (!busy && busyTimer) {
      clearInterval(busyTimer);
      busyTimer = null;
    }
    if (busy) updateBusyText();
  }

  function updateBusyText() {
    if (S.sending) {
      var secs = Math.round((nowMs() - S.sendStartedAt) / 1000);
      el.busyText.textContent = "DJ přemýšlí… " + secs + " s (obvykle 15–25 s)";
    } else {
      el.busyText.textContent = "DJ zrovna zpracovává jiný požadavek…";
    }
  }

  function showReply(text, isError) {
    el.reply.textContent = text;
    el.reply.classList.toggle("error", !!isError);
    el.reply.classList.add("show");
  }

  async function send() {
    var text = el.prompt.value.trim();
    if (!text || S.sending) return;
    if (S.status && S.status.busy) {
      showReply("DJ právě zpracovává jiný požadavek. Zkus to za chvíli.", true);
      return;
    }

    S.sending = true;
    S.sendStartedAt = nowMs();
    setBusy(true);
    el.reply.classList.remove("show");

    try {
      var data = await postJSON("/api/prompt", { text: text });
      el.prompt.value = "";
      autosize();
      showReply((data && data.reply) || "Hotovo.", false);
      hideBanner();
    } catch (e) {
      if (e.status === 409) {
        showReply("DJ ještě dokončuje předchozí požadavek — zkus to za chvíli znovu. Text ti zůstal v poli.", true);
      } else if (e.status) {
        showReply("Požadavek selhal (" + e.status + "): " + e.message, true);
      } else {
        showReply("Server neodpověděl. Zkontroluj, jestli ytdj běží.", true);
      }
    } finally {
      S.sending = false;
      setBusy(!!(S.status && S.status.busy));
      el.prompt.disabled = false;
      el.btnSend.disabled = !el.prompt.value.trim();
      if (!polling) refresh();
    }
  }

  function autosize() {
    el.prompt.style.height = "auto";
    el.prompt.style.height = Math.min(el.prompt.scrollHeight, 160) + "px";
  }

  el.prompt.addEventListener("input", function () {
    autosize();
    el.btnSend.disabled = S.sending || !el.prompt.value.trim() ||
                          !!(S.status && S.status.busy);
  });

  el.prompt.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      send();
    }
  });

  el.btnSend.addEventListener("click", send);

  /* ------------------------------------------------------------------ */
  /* nastavení                                                           */
  /* ------------------------------------------------------------------ */

  var cfg = { values: {}, fields: [] };

  function openSettings() {
    el.settings.classList.add("show");
    el.settings.setAttribute("aria-hidden", "false");
    el.backdrop.classList.add("show");
    loadConfig();
  }
  function closeSettings() {
    el.settings.classList.remove("show");
    el.settings.setAttribute("aria-hidden", "true");
    el.backdrop.classList.remove("show");
    el.openSettings.focus();
  }

  el.openSettings.addEventListener("click", openSettings);
  el.closeSettings.addEventListener("click", closeSettings);
  el.backdrop.addEventListener("click", closeSettings);
  el.btnReload.addEventListener("click", loadConfig);

  function setMsg(text, kind) {
    el.settingsMsg.textContent = text || "";
    el.settingsMsg.className = "msg" + (kind ? " " + kind : "");
  }

  async function loadConfig() {
    setMsg("");
    el.settingsBody.innerHTML = '<p class="empty">Načítám…</p>';
    try {
      var res = await fetch("/api/config", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      cfg.values = (data && data.values) || {};
      cfg.fields = (data && data.fields) || [];
      renderConfig();
    } catch (e) {
      el.settingsBody.innerHTML = '<p class="empty">Nastavení se nepodařilo načíst: ' +
                                  esc(e.message) + "</p>";
    }
  }

  function renderConfig() {
    if (!cfg.fields.length) {
      el.settingsBody.innerHTML = '<p class="empty">Server nenabízí žádná nastavení.</p>';
      return;
    }
    var html = cfg.fields.map(function (f, i) {
      var key = f.key;
      var val = cfg.values[key];
      var id = "cfg_" + i;
      var badge = f.restart ? ' <span class="tag">nutný restart</span>' : "";
      var help = f.help ? '<p class="help">' + esc(f.help) + "</p>" : "";
      var label = esc(f.label || key);
      var head = '<label class="top" for="' + id + '">' + label + badge + "</label>" + help;
      var out = '<div class="field" data-key="' + esc(key) + '" data-type="' + esc(f.type || "str") + '">';

      if (f.type === "bool") {
        out += head + '<label class="check"><input type="checkbox" id="' + id + '"' +
               (val ? " checked" : "") + "><span>" + (val ? "zapnuto" : "vypnuto") + "</span></label>";
      } else if (f.type === "choice") {
        var opts = (f.choices || []).map(function (c) {
          var cv = (c && typeof c === "object") ? c.value : c;
          var cl = (c && typeof c === "object") ? (c.label != null ? c.label : c.value) : c;
          var sel = String(cv) === String(val == null ? "" : val) ? " selected" : "";
          return '<option value="' + esc(cv) + '"' + sel + ">" +
                 esc(cl === "" || cl == null ? "(výchozí)" : cl) + "</option>";
        }).join("");
        out += head + '<select id="' + id + '">' + opts + "</select>";
      } else if (f.type === "int") {
        out += head + '<input type="number" step="1" id="' + id + '" value="' +
               esc(val == null ? "" : val) + '">';
      } else {
        var text = Array.isArray(val) ? val.join(" ") : (val == null ? "" : val);
        out += head + '<input type="text" id="' + id + '" value="' + esc(text) + '">';
      }
      return out + "</div>";
    }).join("");

    el.settingsBody.innerHTML = html;

    // popisek u přepínačů ať odpovídá stavu
    Array.prototype.forEach.call(el.settingsBody.querySelectorAll(".check input"), function (cb) {
      cb.addEventListener("change", function () {
        var span = cb.parentNode.querySelector("span");
        if (span) span.textContent = cb.checked ? "zapnuto" : "vypnuto";
      });
    });
  }

  function collectChanges() {
    var changed = {};
    var fields = el.settingsBody.querySelectorAll(".field");
    Array.prototype.forEach.call(fields, function (div) {
      var key = div.getAttribute("data-key");
      var type = div.getAttribute("data-type");
      var input = div.querySelector("input, select");
      if (!input) return;
      var val;
      if (type === "bool") {
        val = input.checked;
      } else if (type === "int") {
        if (input.value.trim() === "") return;
        val = parseInt(input.value, 10);
        if (isNaN(val)) return;
      } else {
        val = input.value;
      }

      var old = cfg.values[key];
      if (Array.isArray(old)) old = old.join(" ");
      var same = (type === "bool")
        ? (!!old === val)
        : (String(old == null ? "" : old) === String(val));
      if (!same) changed[key] = val;
    });
    return changed;
  }

  el.btnSave.addEventListener("click", async function () {
    var changed = collectChanges();
    var keys = Object.keys(changed);
    if (!keys.length) { setMsg("Beze změn."); return; }

    el.btnSave.disabled = true;
    setMsg("Ukládám…");
    try {
      var data = await postJSON("/api/config", changed);
      keys.forEach(function (k) { cfg.values[k] = changed[k]; });
      var restart = (data && data.restart_required) || [];
      if (restart.length) {
        var names = restart.map(function (k) {
          var f = cfg.fields.filter(function (x) { return x.key === k; })[0];
          return (f && f.label) || k;
        });
        setMsg("Uloženo. Projeví se až po restartu ytdj: " + names.join(", ") + ".", "warn");
      } else {
        setMsg("Uloženo — " + keys.length + (keys.length === 1 ? " změna." : " změny."));
      }
    } catch (e) {
      setMsg("Uložení selhalo: " + e.message, "err");
    } finally {
      el.btnSave.disabled = false;
    }
  });

  /* ------------------------------------------------------------------ */
  /* start                                                               */
  /* ------------------------------------------------------------------ */

  el.btnSend.disabled = true;
  autosize();
  refresh();
  startSSE();
})();
</script>
</body>
</html>
